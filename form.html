<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">


</head>

<body>
    <div class="box-form">

        <h1 class="title">
            <span>Login</span>
            <span>|</span>
            <span class="color-title">Register</span>
        </h1>

        <div class="text-top">
            <p>Enter your email and password to register.</p>
        </div>

        <form action="#">
            <input type="text" name="username" placeholder="Username" minlength="3" maxlength="15"
                pattern="^[A-Za-z0-9_]+$" required>

            <input type="email" name="email" placeholder="Enter your email address" required>

            <div class="password-box">
                <input class="input password" type="password" placeholder="Password" minlength="6" required>
                <button type="button" class="toggle-password">
                    <img src="./img/Hide.png" alt="hide icon" width="20" height="20">
                </button>
            </div>

            <input type="tel" name="phone number" placeholder="Enter your phone number" pattern="^\+?380\d{9}$">

            <label class="agreement" for="agree-checkbox">
                <div class="checkbox-wrapper-31">
                    <input type="checkbox" id="agree-checkbox" name="agreement" required>
                    <svg viewBox="0 0 35.6 35.6">
                        <circle class="background" cx="17.8" cy="17.8" r="17.8"></circle>
                        <circle class="stroke" cx="17.8" cy="17.8" r="14.37"></circle>
                        <polyline class="check" points="11.78 18.12 15.55 22.23 25.17 12.87"></polyline>
                    </svg>
                </div>
                <span>I agree to the use of my personal data</span>
            </label>

            <input class="register-button" type="submit" name="register" value="Register">
        </form>

        <div class="text-below">
            <p><span><img src="./img/Line.png" alt="line"></span>
                <span>Or register with</span>
                <span><img src="./img/Line.png" alt="line"></span>
            </p>
        </div>

        <button class="social-button-1" type="button"><img src="./img/Group.png" alt="google logo">Continue with
            Google</button>

        <button class="social-button-2" type="button"><img src="./img/facebook.png" alt="facebook logo">Continue
            with
            Facebook</button>

    </div>


    <script>
        const button = document.querySelector('.toggle-password')
        const passwordInput = document.querySelector('.password.input')

        button.addEventListener('click', (event) => {
            if (passwordInput.getAttribute('type') === 'text') {
                passwordInput.setAttribute('type', 'password');
            } else {
                passwordInput.setAttribute('type', 'text');
            }
        })
    </script>
</body>

</html>
